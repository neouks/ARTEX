name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Test ARTEX
        run: go test ./...
      - name: Test norma
        if: runner.os == 'Linux'
        working-directory: third_party/norma
        run: go test ./...
      - name: Test Windows shell profiles
        if: runner.os == 'Windows'
        working-directory: third_party/norma
        run: go test ./tool -run "Test(ShellProfile|DetectShell|GitBash|WindowsBash|InteractiveSupport)"

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run build
        working-directory: web
